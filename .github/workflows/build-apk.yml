
name: Build Resdex AI Sourcer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract source
        run: |
          unzip -q resdex-ai-sourcer-android-source.zip -d extracted

      - name: Update Android build versions
        working-directory: extracted/resdex-ai-sourcer-android
        run: |
          sed -i 's/version "8.7.3"/version "8.13.2"/' build.gradle.kts
          sed -i 's/version "2.0.21"/version "2.3.0"/g' build.gradle.kts

      - name: Build APK
        working-directory: extracted/resdex-ai-sourcer-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resdex-ai-sourcer-apk
          path: extracted/resdex-ai-sourcer-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
