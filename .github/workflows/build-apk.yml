
name: Build Resdex AI Sourcer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android source
        run: |
          unzip -q resdex-ai-sourcer-android-source.zip -d extracted

      - name: Update Android build versions
        working-directory: extracted/resdex-ai-sourcer-android
        run: |
          sed -i 's/version "8.7.3"/version "8.13.2"/' build.gradle.kts
          sed -i 's/version "2.0.21"/version "2.3.0"/g' build.gradle.kts

      - name: Fix Kotlin compiler configuration
        working-directory: extracted/resdex-ai-sourcer-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          pattern = r'\n    kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}\s*'
          updated, count = re.subn(pattern, "\n", s, count=1)

          if count != 1:
              raise SystemExit("Old Kotlin compiler configuration not found")

          updated += """
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """
          p.write_text(updated)
          PY

      - name: Fix Gemini Nano API imports
        working-directory: extracted/resdex-ai-sourcer-android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/wahtalent/resdexsourcer/MainActivity.kt")
          s = p.read_text()

          s = s.replace(
              "import com.google.mlkit.genai.prompt.DownloadStatus",
              "import com.google.mlkit.genai.common.DownloadStatus"
          )
          s = s.replace(
              "import com.google.mlkit.genai.prompt.FeatureStatus",
              "import com.google.mlkit.genai.common.FeatureStatus"
          )

          old = "checkStatus = { model.checkStatus().toString() },"
          new = """checkStatus = {
                          when (model.checkStatus()) {
                              FeatureStatus.AVAILABLE -> "AVAILABLE"
                              FeatureStatus.DOWNLOADABLE -> "DOWNLOADABLE"
                              FeatureStatus.DOWNLOADING -> "DOWNLOADING"
                              FeatureStatus.UNAVAILABLE -> "UNAVAILABLE"
                              else -> "UNKNOWN"
                          }
                      },"""

          if old not in s:
              raise SystemExit("Could not locate checkStatus code")

          s = s.replace(old, new, 1)

          if "import com.google.mlkit.genai.common.DownloadStatus" not in s:
              raise SystemExit("DownloadStatus import was not corrected")
          if "import com.google.mlkit.genai.common.FeatureStatus" not in s:
              raise SystemExit("FeatureStatus import was not corrected")

          p.write_text(s)
          print("Gemini Nano imports and availability status corrected")
          PY

      - name: Build APK
        working-directory: extracted/resdex-ai-sourcer-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resdex-ai-sourcer-apk
          path: extracted/resdex-ai-sourcer-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
